name: manifest-check

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  COMPACTC: '0.35.0'
  SOURCE: contract/src/freightlock.compact
  MANAGED: contract/src/managed/freightlock/contract

jobs:
  voyage:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v4

      - name: Toolchain / node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Toolchain / compact
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Toolchain / compactc ${{ env.COMPACTC }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: compact update ${{ env.COMPACTC }}

      - name: Contract / keys
        run: |
          compact compile $SOURCE build-zk
          test -d build-zk/keys

      - name: Contract / reproducible js
        run: |
          compact compile --skip-zk $SOURCE build-js
          diff -r -x '*.map' build-js/contract $MANAGED

      - name: App / deps
        run: npm ci
      - name: App / tsc
        run: npm run typecheck
      - name: App / vitest
        run: npm test
      - name: App / voyage script
        run: npm run demo
      - name: App / bundle
        run: npm run build:web

      - name: App / package manifest artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  harbour:
    name: harbour-dispatch
    needs: voyage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dispatch.outputs.page_url }}
    steps:
      - name: Deploy to station
        id: dispatch
        uses: actions/deploy-pages@v4
